name: Java build tests and bytecode security
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '27'
      - name: Start real DynamoDB Local for adapter and HTTP security contracts
        run: docker run -d --name auth-contract-dynamodb -p 127.0.0.1:8000:8000 amazon/dynamodb-local:3.2.0 -jar DynamoDBLocal.jar -inMemory -sharedDb
      - name: Verify compiled code with SpotBugs and Find Security Bugs
        env:
          TEST_DYNAMO_ENDPOINT: http://127.0.0.1:8000
        run: sh mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: java-analysis
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
            target/site/jacoco/

