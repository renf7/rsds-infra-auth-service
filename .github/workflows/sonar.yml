name: SonarQube Cloud
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TEST_DYNAMO_ENDPOINT: http://127.0.0.1:8000
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '27'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked Sonar setup HTTP client
        run: |
          python -m pip install --only-binary :all: --require-hashes -r tools/security/sonar-requirements.txt
      - name: Ensure the new Sonar project is public before analysis
        run: python tools/security/sonar-public.py
      - name: Start real DynamoDB Local for adapter and HTTP security contracts
        run: docker run -d --name auth-contract-dynamodb -p 127.0.0.1:8000:8000 amazon/dynamodb-local:3.2.0 -jar DynamoDBLocal.jar -inMemory -sharedDb
      - name: Require token and analyze compiled Java with real coverage
        run: |
          test -n "$SONAR_TOKEN" || { echo 'Missing SONAR_TOKEN repository secret'; exit 1; }
          sh mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.projectKey="${{ github.event.repository.name }}" -Dsonar.organization=renf7 -Dsonar.host.url=https://sonarcloud.io -Dsonar.projectVisibility=public -Dsonar.qualitygate.wait=true

