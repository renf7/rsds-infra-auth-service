name: SonarQube Cloud
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_DYNAMO_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '27'
      - name: Compile and test without Sonar credentials
        run: |
          docker run -d --name auth-contract-dynamodb -p 127.0.0.1:8000:8000 amazon/dynamodb-local:3.2.0 -jar DynamoDBLocal.jar -inMemory -sharedDb
          sh mvnw -B verify dependency:copy-dependencies -DoutputDirectory=target/sonar-libraries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-java-input
          retention-days: 1
          path: |
            target/classes/
            target/test-classes/
            target/site/jacoco/jacoco.xml
            target/sonar-libraries/
  analyze:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sonar-java-input
          path: target
      - name: Verify public Sonar project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'Missing SONAR_TOKEN'; exit 1; }
          curl --fail --silent --show-error --max-time 30 --user "$SONAR_TOKEN:" 'https://sonarcloud.io/api/components/show?component=rsds-infra-auth-service' | jq -e '.component.visibility == "public"'
      - name: Write fixed scanner configuration without executing repository scripts
        run: |
          cat > "$RUNNER_TEMP/auth-sonar.properties" <<'PROPERTIES'
          sonar.projectKey=rsds-infra-auth-service
          sonar.organization=renf7
          sonar.host.url=https://sonarcloud.io
          sonar.sources=src/main/java
          sonar.tests=src/test/java
          sonar.java.binaries=target/classes
          sonar.java.test.binaries=target/test-classes
          sonar.java.libraries=target/sonar-libraries/*.jar
          sonar.java.test.libraries=target/sonar-libraries/*.jar
          sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          sonar.qualitygate.wait=true
          PROPERTIES
      - name: Scan compiled Java in a fresh job without Maven execution
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dproject.settings=${{ runner.temp }}/auth-sonar.properties
