rsds.auth.local=true
rsds.auth.dynamo-endpoint=http://rsds-local-dynamodb:8000
rsds.auth.idp-base=http://rsds-local-idp:9000
# Clear the production override: the container marks HTTPS session cookies Secure,
# while isolated HTTP fixtures remain usable. Never force insecure cookies on HTTPS.
server.servlet.session.cookie.secure=
server.servlet.session.cookie.same-site=lax
rsds.auth.providers.apple.client-id=local-apple
rsds.auth.providers.apple.team-id=LOCALTEAM
rsds.auth.providers.apple.key-id=local-apple-client
rsds.auth.providers.apple.private-key-file=/run/signing/apple.p8
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
