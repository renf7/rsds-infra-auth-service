spring.application.name=rsds-infra-auth-service
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.timeout=5m
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
rsds.auth.local=false
rsds.auth.issuer=https://www.rsdsoftware.eu/auth
rsds.auth.audience=rsds-infra
rsds.auth.private-key=/run/signing/private.pem
rsds.auth.public-certificates=/run/trust
rsds.auth.region=eu-central-1
rsds.auth.table=rsds-infra
rsds.auth.dynamo-endpoint=
rsds.auth.idp-base=
